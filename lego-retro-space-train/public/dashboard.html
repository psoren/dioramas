<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>WFC Iteration Dashboard</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #0f0f15;
      color: #ddd;
      padding: 16px;
    }
    h1 { margin: 0 0 4px; font-weight: 600; font-size: 18px; letter-spacing: 0.04em; }
    .subtitle { color: #888; font-size: 12px; margin-bottom: 24px; }
    .batch {
      background: #15151d;
      border: 1px solid #232330;
      border-radius: 8px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }
    .batch h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 500;
      color: #aaa;
    }
    .batch h2 code {
      background: #232333;
      padding: 1px 6px;
      border-radius: 4px;
      color: #c7c7e0;
      margin-right: 6px;
    }
    .stats {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: #999;
      margin: 6px 0 8px;
    }
    .stats .good { color: #5e5; }
    .stats .bad { color: #f77; }
    .notes {
      background: #1d1d28;
      border-left: 3px solid #4a8;
      padding: 8px 10px;
      margin: 8px 0 14px;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      color: #d3d3d3;
    }
    .notes.empty { color: #555; font-style: italic; }
    .sets {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .set {
      background: #0d0d14;
      border: 1px solid #22222e;
      border-radius: 6px;
      padding: 8px;
    }
    .set .render-stack {
      position: relative;
      cursor: zoom-in;
      border-radius: 4px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 8 / 5;
    }
    .set .render-stack img.main {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .set .render-stack img.topdown-svg {
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 38%;
      max-width: 90px;
      border: 1px solid #333;
      background: #1a1a22;
      border-radius: 3px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      display: block;
    }
    /* Fallback when 3D PNG is missing: SVG is the only render, shown
       full-frame instead of as a thumbnail. */
    .set .render-stack.svg-only {
      cursor: default;
      background: #1a1a22;
      aspect-ratio: 1 / 1;
    }
    .set .render-stack.svg-only img {
      position: static;
      width: 100%;
      max-width: none;
      height: 100%;
      object-fit: contain;
      border: none;
      box-shadow: none;
      background: transparent;
    }
    .set .meta {
      font-family: ui-monospace, monospace;
      font-size: 10px;
      color: #888;
      margin-top: 6px;
    }
    .set .meta.fail { color: #f77; }
    .set .meta .ok { color: #5e5; }
    /* Lightbox / fullscreen modal */
    .lightbox {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.92);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 96vw;
      max-height: 96vh;
      object-fit: contain;
    }
    .lightbox .caption {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #ccc;
      font-family: ui-monospace, monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightbox-img" alt="">
    <div class="caption" id="lightbox-caption"></div>
  </div>
  <h1>WFC Generation Iterations</h1>
  <div class="subtitle">Newest batch on top. Each batch is 10 layouts at 13×13.</div>
  <div id="batches"></div>
  <script>
    async function load() {
      const res = await fetch('/batches/index.json', { cache: 'no-store' });
      if (!res.ok) {
        document.getElementById('batches').innerHTML =
          '<div class="batch">No batches yet — run <code>npx vitest run scripts/render-batch</code>.</div>';
        return;
      }
      const batches = await res.json();
      const root = document.getElementById('batches');
      for (const batch of batches) {
        const div = document.createElement('div');
        div.className = 'batch';
        const dt = new Date(batch.timestamp);
        const okPct = ((batch.stats.solves / batch.stats.total) * 100).toFixed(0);
        const parallelPct = ((batch.stats.layoutsWithParallel / batch.stats.total) * 100).toFixed(0);
        const elevatedPct = ((batch.stats.elevatedOK / batch.stats.total) * 100).toFixed(0);
        div.innerHTML = `
          <h2><code>${batch.commit}</code>${dt.toLocaleString()}</h2>
          <div class="stats">
            solves: <span class="${batch.stats.solves === batch.stats.total ? 'good' : 'bad'}">${batch.stats.solves}/${batch.stats.total}</span> (${okPct}%)
            • parallel: <span class="${batch.stats.layoutsWithParallel >= 7 ? 'good' : 'bad'}">${batch.stats.layoutsWithParallel}/${batch.stats.total}</span> (${parallelPct}%)
            • elevated graph: <span class="${batch.stats.elevatedOK >= 7 ? 'good' : 'bad'}">${batch.stats.elevatedOK}/${batch.stats.total}</span> (${elevatedPct}%)
            • parallel cells total: ${batch.stats.parallelTotal}
            ${batch.stats.coverageMean !== undefined ? `• coverage mean: <span class="${batch.stats.coverageMean >= 0.7 ? 'good' : 'bad'}">${(batch.stats.coverageMean * 100).toFixed(0)}%</span>` : ''}
          </div>
          <div class="notes ${batch.notes ? '' : 'empty'}">${batch.notes || 'No notes yet.'}</div>
          <div class="sets">
            ${batch.sets.map((s, i) => {
              if (!s.ok) {
                return `<div class="set"><div class="meta fail">FAIL: ${escapeHtml(s.error || 'unknown')}</div></div>`;
              }
              const parallelTag = (s.parallel ?? 0) > 0 ? `parallel=${s.parallel}` : 'parallel=0';
              const elevTag = s.elevatedOK ? '<span class="ok">elev✓</span>' : 'elev✗';
              const errLine = s.elevatedErr && !s.elevatedOK
                ? `<div class="meta" style="color:#a66;font-size:9px">${escapeHtml(s.elevatedErr)}</div>`
                : '';
              const pngUrl = `/batches/${batch.batchId}/set-${i + 1}.png`;
              const svgUrl = `/batches/${batch.batchId}/set-${i + 1}.svg`;
              const caption = `${batch.commit} • set ${i + 1} • seed ${s.seed} • ${s.tiles}t • ${parallelTag} • ${elevTag}`;
              // Each set's render-stack is referenced by data-png so the
              // missing-image handler (handleMissingPng, defined below)
              // can mutate it ONCE without re-triggering itself.
              const covTag = s.coverage !== undefined
                ? `<span style="color:${s.coverage >= 0.7 ? '#5e5' : s.coverage >= 0.4 ? '#bb5' : '#a66'}">cov ${(s.coverage * 100).toFixed(0)}%</span>`
                : '';
              return `
                <div class="set">
                  <div class="render-stack" data-png="${pngUrl}" onclick="openLightbox(this.dataset.png, '${escapeAttr(caption)}')">
                    <img class="main" src="${pngUrl}" alt="set ${i + 1} 3/4 view" onerror="handleMissingPng(this)">
                    <img class="topdown-svg" src="${svgUrl}" alt="top-down">
                  </div>
                  <div class="meta">seed ${s.seed} • ${s.tiles}t • ${parallelTag} • ${elevTag} • ${covTag}</div>
                  ${errLine}
                </div>
              `;
            }).join('')}
          </div>
        `;
        root.appendChild(div);
      }
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }
    function handleMissingPng(img) {
      // Detach the error handler FIRST so any reflow doesn't re-fire it.
      img.onerror = null;
      const stack = img.parentElement;
      if (!stack || stack.dataset.fallback === '1') return;
      stack.dataset.fallback = '1';
      // Promote the top-down SVG to the main render slot and drop the
      // missing PNG image. No clickable lightbox for older batches that
      // don't have a 3D screenshot.
      const svg = stack.querySelector('.topdown-svg');
      stack.classList.add('svg-only');
      stack.onclick = null;
      stack.style.cursor = 'default';
      img.remove();
      if (svg) svg.classList.remove('topdown-svg');
    }
    function escapeAttr(s) {
      return escapeHtml(s).replace(/'/g, '&#39;');
    }
    function openLightbox(src, caption) {
      const lb = document.getElementById('lightbox');
      document.getElementById('lightbox-img').src = src;
      document.getElementById('lightbox-caption').textContent = caption;
      lb.classList.add('open');
    }
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
    });
    load();
  </script>
</body>
</html>
